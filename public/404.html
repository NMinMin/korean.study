<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Korean Study</title>
    <script>
      // GitHub Pages không hỗ trợ SPA fallback. Chuyển đường dẫn về index.html
      // rồi đoạn script trong index.html sẽ khôi phục URL ban đầu.
      (function (location) {
        var pathSegmentsToKeep = 1;
        var base = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var route = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
        location.replace(location.protocol + '//' + location.host + base + '/?/' + route + query + location.hash);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
