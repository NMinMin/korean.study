<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Korean Study</title>
    <script>
      // GitHub Pages không hỗ trợ SPA fallback. Chuyển route cũ như /admin
      // sang hash route để lần tải tiếp theo luôn nhận HTTP 200.
      (function (location) {
        var pathSegmentsToKeep = 1;
        var base = location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var route = location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var query = location.search || '';
        var authFragment = location.hash || '';
        // Recovery token của Supabase nằm trong fragment. Đưa nguyên fragment
        // về entry 200 của Pages để Supabase JS đọc token trước khi HashRouter
        // chuyển người dùng vào màn hình tạo mật khẩu mới.
        if (route === 'auth/reset-password' && /(?:access_token=|type=recovery)/.test(authFragment)) {
          location.replace(location.protocol + '//' + location.host + base + '/' + authFragment);
          return;
        }
        location.replace(location.protocol + '//' + location.host + base + '/#/' + route + query);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
